parameters:
    env(GMO_API_BASE_URL): 'https://pt01.mul-pay.jp/payment'
    env(GMO_SHOP_ID): ''
    env(GMO_SHOP_PASS): ''
    env(GMO_MOCK_MODE): '1'
    env(GMO_JOB_CD): 'CAPTURE'
    env(GMO_TEST_CARD_NO): '4111111111111111'
    env(GMO_TEST_CARD_EXPIRE): '2912'
    env(GMO_TEST_CARD_SECURITY_CODE): '123'
    env(SUBSCRIPTION_ENABLED): '1'
    env(SUBSCRIPTION_ALLOW_TEST_INTERVAL): '1'
    env(SUBSCRIPTION_MAX_RETRY): '3'
    env(SUBSCRIPTION_RETRY_DAYS): '1,3,7'
    env(SUBSCRIPTION_MAIL_FROM_EMAIL): ''
    env(SUBSCRIPTION_MAIL_FROM_NAME): 'Balocco'

services:
    Customize\Form\Extension\ShoppingOrderTypeExtension:
        autowire: true
        autoconfigure: true
        arguments:
            $requestStack: '@request_stack'
            $subscriptionEnabled: '%env(bool:SUBSCRIPTION_ENABLED)%'
            $allowTestInterval: '%env(bool:SUBSCRIPTION_ALLOW_TEST_INTERVAL)%'

    Customize\Service\Gmo\GmoApiClient:
        arguments:
            $apiBaseUrl: '%env(string:GMO_API_BASE_URL)%'
            $shopId: '%env(string:GMO_SHOP_ID)%'
            $shopPass: '%env(string:GMO_SHOP_PASS)%'
            $mockMode: '%env(bool:GMO_MOCK_MODE)%'
            $jobCd: '%env(string:GMO_JOB_CD)%'
            $testCardNo: '%env(string:GMO_TEST_CARD_NO)%'
            $testCardExpire: '%env(string:GMO_TEST_CARD_EXPIRE)%'
            $testCardSecurityCode: '%env(string:GMO_TEST_CARD_SECURITY_CODE)%'

    Customize\Service\Subscription\SubscriptionBillingRunner:
        autowire: true
        arguments:
            $shoppingPurchaseFlow: '@eccube.purchase.flow.shopping'
            $retryDayOffsetsCsv: '%env(string:SUBSCRIPTION_RETRY_DAYS)%'

    Customize\Service\Subscription\SubscriptionMailNotifier:
        autowire: true
        arguments:
            $fromEmail: '%env(string:SUBSCRIPTION_MAIL_FROM_EMAIL)%'
            $fromName: '%env(string:SUBSCRIPTION_MAIL_FROM_NAME)%'

    Customize\EventSubscriber\Subscription\SubscriptionShoppingCompleteSubscriber:
        autowire: true
        autoconfigure: true
        arguments:
            $subscriptionEnabled: '%env(bool:SUBSCRIPTION_ENABLED)%'
            $allowTestInterval: '%env(bool:SUBSCRIPTION_ALLOW_TEST_INTERVAL)%'
            $subscriptionMaxRetry: '%env(int:SUBSCRIPTION_MAX_RETRY)%'

    Customize\Command\SubscriptionRunCommand:
        autowire: true
        autoconfigure: true
        arguments:
            $subscriptionEnabled: '%env(bool:SUBSCRIPTION_ENABLED)%'

    Customize\Command\SubscriptionCancelCommand:
        autowire: true
        autoconfigure: true
